<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<link rel="icon" type="image/png" href="yinyangfavicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: #000000;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 2rem;
}

.container {
  max-width: 600px;
}

.preview-image {
  max-width: 100%;
  height: auto;
  max-height: 250px;
  margin-bottom: 2rem;
  object-fit: contain;
  display: block;
  margin-left: auto;
  margin-right: auto;
}

h1 {
  font-family: "Times New Roman", Times, Georgia, "Baskerville", serif;
  font-weight: 300; /* Light / thin styling */
  font-size: 2.25rem;
  color: #ffffff;
  letter-spacing: 0.05em;
  margin-bottom: 2rem; /* Spacing between the text and the new image */
}
.yin-yang-icon {
  color: #ffffff;
  font-size: 2.5rem;
  margin-bottom: 2rem;
  display: inline-block;
}
.bottom-image {
  max-width: 100%;
  height: auto;
  max-height: 200px;
  object-fit: contain;
  display: block;
  margin-left: auto;
  margin-right: auto;
}
</style>
</head>
<body>

<div class="container">
  <img src="green-dragon.png" alt="Preview Image" class="preview-image">

  <h1>we might be coming soon…</h1>
  <i class="fa-solid fa-yin-yang yin-yang-icon"></i>

  <img src="white_austin_outline.png" alt="austin scott" class="bottom-image">
</div>

</body>
</html>
