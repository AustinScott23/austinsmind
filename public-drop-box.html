            <div class="content__entry">
               <div><div style="max-width: 800px; margin: 20px auto;">
<textarea id="localScratchpad" placeholder="Type or paste your notes here..."

style="width: 100%; height: 60vh; padding: 14px; font-family: monospace, sans-serif; font-
size: 14px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; resize: vertical;

background: #fafafa;"></textarea>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top:
8px;">
<span id="saveStatus" style="font-size: 12px; color: #666;">Auto-saved</span>
<button type="button" onclick="clearScratchpad()" style="font-size: 12px; padding: 4px 10px;
background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer;">Clear All</
button>
</div>
</div>
<script>
const pad = document.getElementById('localScratchpad');
const status = document.getElementById('saveStatus');
pad.value = localStorage.getItem('siteScratchpadContent') || '';
pad.addEventListener('input', () => {
localStorage.setItem('siteScratchpadContent', pad.value);
status.textContent = 'Saving...';
setTimeout(() => { status.textContent = 'Auto-saved'; }, 300);
});
function clearScratchpad() {
if (confirm('Are you sure you want to clear this scratchpad?')) {
pad.value = '';
localStorage.removeItem('siteScratchpadContent');
status.textContent = 'Cleared';
}
}
</script>

        var images = document.querySelectorAll('img[loading]');
        for (var i = 0; i < images.length; i++) {
            if (images[i].complete) {
                images[i].classList.add('is-loaded');
            } else {
                images[i].addEventListener('load', function () {
                    this.classList.add('is-loaded');
                }, false);
            }
        }
