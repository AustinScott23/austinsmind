12px; border: 1px solid #0969da; border-radius: 4px;">+ Add PDF / File <input type="file" id="fileInput2" accept=".pdf,application/pdf" style="display: none;" onchange="saveFile2(this)"></label><div id="fileList2" style="margin-top: 12px; text-align: left;"></div></div></div><script>const pad2 = document.getElementById('localPad2');
const status2 = document.getElementById('saveStatus2');
pad2.value = localStorage.getItem('siteScratchpadContent2') || '';
pad2.addEventListener('input', function() {
localStorage.setItem('siteScratchpadContent2', pad2.value);
status2.textContent = 'Saving...';
setTimeout(function() { status2.textContent = 'Auto-saved'; }, 300);
});
function clearText2() {
if (confirm('Clear text on this page?')) {
pad2.value = '';
localStorage.removeItem('siteScratchpadContent2');
status2.textContent = 'Cleared';
}
}
let db2;
const req2 = indexedDB.open('ScratchpadDB_Files', 1);
req2.onupgradeneeded = function(e) {
e.target.result.createObjectStore('files', { keyPath: 'id', autoIncrement: true });
};
req2.onsuccess = function(e) {
db2 = e.target.result;
renderFiles2();
};
function saveFile2(input) {
const file = input.files[0];
if (!file) return;
const tx = db2.transaction('files', 'readwrite');
tx.objectStore('files').add({ name: file.name, data: file, date: new Date().toLocaleDateString() });
tx.oncomplete = function() {
input.value = '';
renderFiles2();
};
}

function renderFiles2() {
const list = document.getElementById('fileList2');
list.innerHTML = '';
const tx = db2.transaction('files', 'readonly');
tx.objectStore('files').openCursor().onsuccess = function(e) {
const cursor = e.target.result;
if (cursor) {
const item = cursor.value;
const div = document.createElement('div');
div.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:6px
0; border-bottom:1px solid #eee; font-size:13px;';
const url = URL.createObjectURL(item.data);
const link = document.createElement('a');
link.href = url;
link.target = '_blank';
link.style.color = '#0969da';
link.style.textDecoration = 'none';
link.textContent = ' ' + item.name;
const delBtn = document.createElement('button');
delBtn.textContent = 'Delete';
delBtn.style.cssText = 'color:#ef4444; background:none; border:none; cursor:pointer; font-size:
12px;';
delBtn.onclick = function() { deleteFile2(item.id); };
div.appendChild(link);
div.appendChild(delBtn);
list.appendChild(div);
cursor.continue();
}
};
}
function deleteFile2(id) {
const tx = db2.transaction('files', 'readwrite');
tx.objectStore('files').delete(id);
tx.oncomplete = function() { renderFiles2(); };
}</script></div></div></div></article></main></div><script defer="defer" src="https://austinleejohnscott.com/assets/js/scripts.min.js?v&#x3D;b2d91bcadbf5db401b76eb5bb3092eb7"></script><script>var images = document.querySelectorAll('img[loading]');
